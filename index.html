<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#DC0A2D">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>KIBBY STIMMY</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Top red section with Pokédex lights -->
        <div class="pokedex-top">
            <div class="top-lights">
                <div class="big-light"></div>
                <div class="small-lights">
                    <div class="small-light red"></div>
                    <div class="small-light yellow"></div>
                    <div class="small-light green"></div>
                </div>
            </div>

            <header>
                <h1>KIBBY STIMMY</h1>
                <p class="subtitle">CAT SOUND SYSTEM v1.0</p>
            </header>
        </div>

        <!-- Screen section with buttons -->
        <div class="screen-section">
            <div class="screen">
                <p class="screen-text">SELECT SOUND TO PLAY</p>
                <p class="screen-text">TAP BUTTON BELOW</p>
            </div>

            <div class="sound-grid">
                <button class="sound-button" data-sound="bird">
                    <span class="icon">🐦</span>
                    <span class="label">BIRD</span>
                </button>

                <button class="sound-button" data-sound="meow">
                    <span class="icon">😺</span>
                    <span class="label">MEOW</span>
                </button>

                <button class="sound-button" data-sound="mouse">
                    <span class="icon">🐭</span>
                    <span class="label">MOUSE</span>
                </button>

                <button class="sound-button" data-sound="purr">
                    <span class="icon">😻</span>
                    <span class="label">PURR</span>
                </button>

                <button class="sound-button" data-sound="crinkle">
                    <span class="icon">📦</span>
                    <span class="label">CRINKLE</span>
                </button>

                <button class="sound-button" data-sound="toy">
                    <span class="icon">🎾</span>
                    <span class="label">TOY</span>
                </button>

                <button class="sound-button" data-sound="hiss">
                    <span class="icon">😾</span>
                    <span class="label">HISS</span>
                </button>

                <button class="sound-button" data-sound="treats">
                    <span class="icon">🍖</span>
                    <span class="label">TREATS</span>
                </button>

                <button class="sound-button" data-sound="kitten">
                    <span class="icon">🐈</span>
                    <span class="label">KITTEN</span>
                </button>

                <button class="sound-button" data-sound="whistle">
                    <span class="icon">💨</span>
                    <span class="label">WHISTLE</span>
                </button>

                <button class="sound-button" data-sound="trill">
                    <span class="icon">😸</span>
                    <span class="label">TRILL</span>
                </button>

                <button class="sound-button" data-sound="can">
                    <span class="icon">🥫</span>
                    <span class="label">CAN</span>
                </button>
            </div>
        </div>

        <!-- Controls section -->
        <div class="controls">
            <button id="cat-reaction-btn" class="reaction-button">
                <span class="reaction-icon">😸</span>
                <span class="reaction-label">SEE HOW YOUR CAT WILL REACT</span>
            </button>

            <div class="volume-control">
                <div class="volume-label">VOLUME CONTROL</div>
                <div class="volume-slider-container">
                    <input type="range" id="volume" min="0" max="100" value="70">
                    <span id="volume-display">70</span>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <footer>
            <p class="footer-text">TURN UP VOLUME FOR BEST RESULTS</p>
        </footer>
    </div>

    <!-- Cat Reaction Overlay -->
    <div id="cat-reaction-overlay" class="cat-overlay">
        <img src="cat-reaction.jpg" alt="Cat Reaction" class="cat-image">
    </div>

    <script src="script.js"></script>
</body>
</html>
