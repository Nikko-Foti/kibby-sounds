<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kibby Sounds - Cat Attention Getter</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🐱 Kibby Sounds 🐱</h1>
            <p class="subtitle">Get your cat's attention with these sounds!</p>
        </header>

        <div class="sound-grid">
            <button class="sound-button" data-sound="bird">
                <span class="icon">🐦</span>
                <span class="label">Bird Chirping</span>
            </button>

            <button class="sound-button" data-sound="meow">
                <span class="icon">😺</span>
                <span class="label">Cat Meowing</span>
            </button>

            <button class="sound-button" data-sound="mouse">
                <span class="icon">🐭</span>
                <span class="label">Mouse Squeaking</span>
            </button>

            <button class="sound-button" data-sound="purr">
                <span class="icon">😻</span>
                <span class="label">Purring</span>
            </button>

            <button class="sound-button" data-sound="crinkle">
                <span class="icon">📦</span>
                <span class="label">Crinkle Sounds</span>
            </button>

            <button class="sound-button" data-sound="toy">
                <span class="icon">🎾</span>
                <span class="label">Toy Squeaking</span>
            </button>

            <button class="sound-button" data-sound="hiss">
                <span class="icon">😾</span>
                <span class="label">Cat Hissing</span>
            </button>

            <button class="sound-button" data-sound="treats">
                <span class="icon">🍖</span>
                <span class="label">Treat Bag</span>
            </button>

            <button class="sound-button" data-sound="kitten">
                <span class="icon">🐈</span>
                <span class="label">Kitten Mewing</span>
            </button>

            <button class="sound-button" data-sound="whistle">
                <span class="icon">💨</span>
                <span class="label">High Whistle</span>
            </button>

            <button class="sound-button" data-sound="trill">
                <span class="icon">😸</span>
                <span class="label">Cat Trill</span>
            </button>

            <button class="sound-button" data-sound="can-opener">
                <span class="icon">🥫</span>
                <span class="label">Can Opener</span>
            </button>
        </div>

        <div class="controls">
            <label for="volume">Volume:</label>
            <input type="range" id="volume" min="0" max="100" value="70">
            <span id="volume-display">70%</span>
        </div>

        <footer>
            <p>💡 Tip: Turn up your device volume for best results!</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
